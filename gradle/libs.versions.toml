[versions]
# Toolchain (checked 2026-11-08)
agp = "9.5.1"
kotlin = "2.4.21"
compileSdk = "37"
targetSdk = "37"
minSdk = "28"
ndk = "30.0.16248370"
cmake = "4.1.2"
# Libraries
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
browser = "1.10.0"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
okio = "3.18.2"
coil = "3.6.3"
xz = "1.12"
lwjgl = "3.4.1"
bouncycastle = "1.86"
minidns = "1.1.3"
# Tests
junit = "6.1.3"
junit4 = "4.13.2"
robolectric = "4.17"
roborazzi = "1.78.0"
composeLints = "1.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
