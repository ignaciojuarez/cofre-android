name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, screenshots, lint, debug APK
        run: ./gradlew --console=plain :core:kit:test testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug
